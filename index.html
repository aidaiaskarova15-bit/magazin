<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Магазин — Касса и учёт</title>
<style>
:root{
  --bg:#F6F4EF;
  --surface:#FFFFFF;
  --ink:#191A17;
  --ink-soft:#5B5D56;
  --line:#E2DED3;
  --primary:#173D36;
  --primary-ink:#FFFFFF;
  --accent:#B8862E;
  --accent-soft:#F1E6CF;
  --danger:#A6362C;
  --danger-soft:#F6E4E1;
  --ok:#2F6B4F;
  --ok-soft:#E4EFE7;
  --radius:14px;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--sans); background:var(--bg); color:var(--ink);
  -webkit-user-select:none; user-select:none;
}
#app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

/* Header */
header{
  background:var(--primary); color:var(--primary-ink);
  padding:14px 16px 12px; display:flex; align-items:center; justify-content:space-between;
  flex-shrink:0;
}
header .brand{display:flex; flex-direction:column;}
header .brand b{font-size:17px; letter-spacing:.2px;}
header .brand span{font-size:11px; opacity:.75; font-family:var(--mono);}
header .clock{font-family:var(--mono); font-size:13px; opacity:.85; text-align:right;}

/* Main scroll area */
main{flex:1; overflow-y:auto; padding:14px 14px 90px;}

/* Bottom tab bar */
nav{
  position:fixed; bottom:0; left:0; right:0; background:var(--surface);
  border-top:1px solid var(--line); display:flex; z-index:50;
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; background:none; border:none; padding:9px 1px 7px; font-family:var(--sans);
  font-size:9.5px; color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:3px;
}
nav button .ic{font-size:16px;}
nav button.active{color:var(--primary); font-weight:700;}
nav button.active .ic{color:var(--accent);}

/* Cards / sections */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; margin-bottom:12px;
}
.section-title{font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); margin:4px 0 10px; font-weight:700;}
.row{display:flex; gap:10px;}
.row > *{flex:1;}

/* Buttons */
button{cursor:pointer; font-family:var(--sans);}
.btn{
  border:none; border-radius:10px; padding:13px 16px; font-size:15px; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
}
.btn-primary{background:var(--primary); color:#fff;}
.btn-accent{background:var(--accent); color:#fff;}
.btn-outline{background:transparent; color:var(--primary); border:1.5px solid var(--primary);}
.btn-danger{background:var(--danger-soft); color:var(--danger);}
.btn-ghost{background:var(--bg); color:var(--ink); border:1px solid var(--line);}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.45;}

input, select{
  width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--line);
  font-size:15px; background:var(--surface); color:var(--ink); font-family:var(--sans);
}
input:focus, select:focus{outline:none; border-color:var(--primary);}
label{font-size:12px; color:var(--ink-soft); font-weight:600; display:block; margin:0 0 5px 2px;}
.field{margin-bottom:10px;}

/* Cart / list rows */
.item-row{
  display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);
}
.item-row:last-child{border-bottom:none;}
.item-row .info{flex:1; min-width:0;}
.item-row .name{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.item-row .meta{font-size:12px; color:var(--ink-soft); font-family:var(--mono);}
.qty-stepper{display:flex; align-items:center; gap:8px;}
.qty-stepper button{
  width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--bg);
  font-size:17px; font-weight:700; color:var(--primary); line-height:1;
}
.qty-stepper span{min-width:26px; text-align:center; font-family:var(--mono); font-weight:700;}
.line-total{font-family:var(--mono); font-weight:700; min-width:70px; text-align:right;}

/* Big total bar */
.total-bar{
  background:var(--primary); color:#fff; border-radius:var(--radius); padding:16px;
  display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
}
.total-bar .label{font-size:12px; opacity:.8; text-transform:uppercase; letter-spacing:.5px;}
.total-bar .amount{font-family:var(--mono); font-size:26px; font-weight:700;}

/* Scanner */
#scanner-wrap{position:relative; border-radius:var(--radius); overflow:hidden; background:#000; margin-bottom:12px;}
#reader{width:100%;}
.scan-hint{position:absolute; bottom:8px; left:0; right:0; text-align:center; color:#fff; font-size:12px; font-family:var(--mono); text-shadow:0 1px 3px rgba(0,0,0,.6);}

/* Badges */
.badge{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; font-family:var(--mono);}
.badge-ok{background:var(--ok-soft); color:var(--ok);}
.badge-low{background:var(--danger-soft); color:var(--danger);}
.badge-accent{background:var(--accent-soft); color:var(--accent);}

/* Empty state */
.empty{padding:30px 10px; text-align:center; color:var(--ink-soft);}
.empty .big{font-size:32px; margin-bottom:8px;}
.empty p{font-size:13px; margin:4px 0 0;}

/* Modal */
.modal-bg{position:fixed; inset:0; background:rgba(20,20,18,.55); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
.modal{background:var(--surface); border-radius:18px 18px 0 0; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; padding:18px 18px 24px;}
.modal h3{margin:0 0 14px; font-size:16px;}
.modal-close{position:absolute; top:14px; right:16px; font-size:20px; color:var(--ink-soft); background:none; border:none;}

/* Receipt */
.receipt{background:#fff; border:1px dashed var(--line); border-radius:10px; padding:16px; font-family:var(--mono); font-size:12.5px;}
.receipt .rline{display:flex; justify-content:space-between; padding:3px 0;}
.receipt hr{border:none; border-top:1px dashed var(--line); margin:8px 0;}
.receipt .center{text-align:center;}

/* Report grid */
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px;}
.stat .n{font-family:var(--mono); font-size:20px; font-weight:700; color:var(--primary);}
.stat .l{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; margin-top:2px;}

.period-tabs{display:flex; gap:8px; margin-bottom:12px;}
.period-tabs button{flex:1; padding:9px; border-radius:9px; border:1.5px solid var(--line); background:var(--surface); font-size:13px; font-weight:600; color:var(--ink-soft);}
.period-tabs button.active{background:var(--primary); color:#fff; border-color:var(--primary);}

.toast{
  position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
  padding:10px 18px; border-radius:30px; font-size:13px; z-index:200; box-shadow:0 4px 14px rgba(0,0,0,.25);
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b id="shopName">Мой магазин</b><span id="deviceStatus">офлайн-режим · данные на устройстве</span></div>
    <div class="clock" id="clock">--:--</div>
  </header>
  <main id="main"></main>
  <nav id="tabbar">
    <button data-tab="kassa" class="active"><span class="ic">🧾</span>Касса</button>
    <button data-tab="prihod"><span class="ic">📥</span>Приход</button>
    <button data-tab="catalog"><span class="ic">📦</span>Каталог</button>
    <button data-tab="debts"><span class="ic">📒</span>Долги</button>
    <button data-tab="reports"><span class="ic">📊</span>Отчёты</button>
    <button data-tab="settings"><span class="ic">⚙️</span>Настройки</button>
  </nav>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============ ХРАНИЛИЩЕ (IndexedDB) ============ */
const DB_NAME = 'shopPosDB', DB_VER = 2;
let db;
function openDB(){
  return new Promise((res, rej)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('products')) d.createObjectStore('products', {keyPath:'barcode'});
      if(!d.objectStoreNames.contains('sales')) d.createObjectStore('sales', {keyPath:'id'});
      if(!d.objectStoreNames.contains('receipts')) d.createObjectStore('receipts', {keyPath:'id'});
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', {keyPath:'key'});
      if(!d.objectStoreNames.contains('debtors')) d.createObjectStore('debtors', {keyPath:'id'});
    };
    req.onsuccess = e=>{db=e.target.result; res(db);};
    req.onerror = e=>rej(e);
  });
}
function tx(store, mode='readonly'){ return db.transaction(store, mode).objectStore(store); }
function idbGetAllLocal(store){ return new Promise((res)=>{ const r = tx(store).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>res([]); }); }
function idbGetLocal(store, key){ return new Promise((res)=>{ const r = tx(store).get(key); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }); }
function idbPutLocal(store, val){ return new Promise((res,rej)=>{ const r = tx(store,'readwrite').put(val); r.onsuccess=()=>res(val); r.onerror=(e)=>rej(e); }); }
function idbDeleteLocal(store, key){ return new Promise((res)=>{ const r = tx(store,'readwrite').delete(key); r.onsuccess=()=>res(true); }); }

/* ============ ОБЛАЧНАЯ БАЗА (Firebase) — для работы с нескольких устройств ============ */
let cloudMode = false;
let fsDB = null;
const CLOUD_META_KEYS = ['shopName','kkm','yakassa']; // эти настройки общие для всех устройств

async function initCloud(){
  const cfg = await idbGetLocal('meta','firebaseConfig');
  if(!cfg || !cfg.value) return false;
  try{
    firebase.initializeApp(cfg.value);
    fsDB = firebase.firestore();
    cloudMode = true;
    return true;
  }catch(err){
    console.error('Firebase init error', err);
    toast('Не удалось подключиться к общей базе. Работаем локально на этом устройстве.');
    return false;
  }
}
function fsCol(store){ return fsDB.collection(store); }
async function fsGetAll(store){
  const snap = await fsCol(store).get();
  return snap.docs.map(d=>d.data());
}
async function fsGet(store, key){
  const doc = await fsCol(store).doc(String(key)).get();
  return doc.exists ? doc.data() : null;
}
async function fsPut(store, val){
  const key = store==='products' ? val.barcode : (val.id || val.key);
  await fsCol(store).doc(String(key)).set(val);
  return val;
}
async function fsDelete(store, key){
  await fsCol(store).doc(String(key)).delete();
  return true;
}

/* Роутер: если облако включено, товары/продажи/должники всегда идут туда — так все устройства видят одно и то же */
const CLOUD_STORES = ['products','sales','debtors'];
async function idbGetAll(store){
  if(cloudMode && CLOUD_STORES.includes(store)) return fsGetAll(store);
  return idbGetAllLocal(store);
}
async function idbGet(store, key){
  if(cloudMode && CLOUD_STORES.includes(store)) return fsGet(store, key);
  if(cloudMode && store==='meta' && CLOUD_META_KEYS.includes(key)) return fsGet('meta', key);
  return idbGetLocal(store, key);
}
async function idbPut(store, val){
  if(cloudMode && CLOUD_STORES.includes(store)) return fsPut(store, val);
  if(cloudMode && store==='meta' && CLOUD_META_KEYS.includes(val.key)) return fsPut('meta', val);
  return idbPutLocal(store, val);
}
async function idbDelete(store, key){
  if(cloudMode && CLOUD_STORES.includes(store)) return fsDelete(store, key);
  return idbDeleteLocal(store, key);
}

/* ============ УТИЛИТЫ ============ */
const fmt = n => (Math.round(n*100)/100).toLocaleString('ru-RU', {minimumFractionDigits:2, maximumFractionDigits:2});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}
function todayKey(d=new Date()){ return d.toISOString().slice(0,10); }

/* ============ СОСТОЯНИЕ ============ */
let currentTab = 'kassa';
let cart = []; // {barcode,name,retailPrice,wholesalePrice,mode,price,qty}
let saleMode = 'pay'; // 'pay' | 'debt'
let saleDebtorName = '';
let scannerCtrl = null;
let scannerMode = null; // 'kassa' | 'prihod' | 'catalog'

/* ============ ЧАСЫ ============ */
setInterval(()=>{
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}, 1000);

/* ============ РЕНДЕР ТАБОВ ============ */
document.getElementById('tabbar').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]'); if(!btn) return;
  stopScanner();
  currentTab = btn.dataset.tab;
  [...document.querySelectorAll('#tabbar button')].forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

async function render(){
  const main = document.getElementById('main');
  if(currentTab==='kassa') main.innerHTML = await viewKassa();
  else if(currentTab==='prihod') main.innerHTML = await viewPrihod();
  else if(currentTab==='catalog') main.innerHTML = await viewCatalog();
  else if(currentTab==='debts') main.innerHTML = await viewDebts();
  else if(currentTab==='reports') main.innerHTML = await viewReports();
  else if(currentTab==='settings') main.innerHTML = await viewSettings();
  bindDynamicHandlers();
}

/* ============ СКАНЕР ШТРИХКОДА ============ */
function scannerHTML(hint){
  return `<div id="scanner-wrap">
    <div id="reader"></div>
    <div class="scan-hint">${hint}</div>
  </div>`;
}
async function startScanner(mode, onResult){
  scannerMode = mode;
  const wrap = document.getElementById('scanner-wrap');
  if(!wrap) return;
  let scanLocked = false;
  try{
    scannerCtrl = new Html5Qrcode("reader");
    const config = { fps:10, qrbox:{width:250,height:130}, formatsToSupport:[
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.QR_CODE
    ]};
    await scannerCtrl.start({facingMode:"environment"}, config, (decodedText)=>{
      if(scanLocked) return; // игнорируем повторные срабатывания, пока штрихкод ещё в кадре
      scanLocked = true;
      if(navigator.vibrate) navigator.vibrate(60);
      const hint = wrap.querySelector('.scan-hint');
      if(hint){ hint.textContent = '✓ Добавлено — уберите штрихкод из кадра'; hint.style.color = '#8FD9A8'; }
      onResult(decodedText);
      setTimeout(()=>{
        scanLocked = false;
        const hintNow = document.querySelector('#scanner-wrap .scan-hint');
        if(hintNow){ hintNow.textContent = 'Наведите камеру на штрихкод'; hintNow.style.color = '#fff'; }
      }, 1500);
    }, ()=>{});
  }catch(err){
    wrap.innerHTML = `<div class="empty"><div class="big">🚫</div><p>Нет доступа к камере.<br>Разрешите камеру в браузере или введите код вручную ниже.</p></div>`;
  }
}
function stopScanner(){
  if(scannerCtrl){
    scannerCtrl.stop().then(()=>scannerCtrl.clear()).catch(()=>{});
    scannerCtrl = null;
  }
}

/* ============ КАССА (продажа) ============ */
async function viewKassa(){
  const total = cart.reduce((s,i)=>s+i.price*i.qty, 0);
  const count = cart.reduce((s,i)=>s+i.qty, 0);
  return `
  ${scannerHTML('Наведите камеру на штрихкод товара')}
  <div class="card" style="padding:10px 12px;">
    <div class="row">
      <input id="manualBarcode" placeholder="Штрихкод вручную" inputmode="numeric">
      <button class="btn btn-ghost" style="width:auto; padding:11px 14px;" id="manualAddBtn">＋</button>
    </div>
  </div>
  <div class="card" style="padding:10px 12px; position:relative;">
    <input id="kassaSearch" placeholder="🔍 Или найдите товар по названию">
    <div id="kassaSearchResults"></div>
  </div>

  <div class="row" style="margin-bottom:12px; gap:8px;">
    <button class="btn ${saleMode==='pay'?'btn-primary':'btn-ghost'}" id="modePayBtn">💵 Оплата сейчас</button>
    <button class="btn ${saleMode==='debt'?'btn-primary':'btn-ghost'}" id="modeDebtBtn">📒 В долг</button>
  </div>
  ${saleMode==='debt' ? `
  <div class="card" style="padding:10px 12px;">
    <label>Имя должника</label>
    <input id="debtorNameInput" placeholder="Например: Айгуль" value="${(saleDebtorName||'').replace(/"/g,'&quot;')}">
  </div>` : ''}

  <div class="total-bar">
    <div><div class="label">Итого чек · ${count} шт.</div><div class="amount">${fmt(total)} сом</div></div>
    <button class="btn btn-accent" style="width:auto; padding:12px 20px;" id="checkoutBtn" ${cart.length? '':'disabled'}>${saleMode==='debt'?'В долг':'Оформить'}</button>
  </div>

  <div class="card">
    <div class="section-title">Товары в чеке</div>
    ${cart.length ? cart.map((i,idx)=>`
      <div class="item-row">
        <div class="info">
          <div class="name">${i.name}</div>
          <div class="meta">${fmt(i.price)} сом/шт · ${i.barcode}</div>
        </div>
        ${i.wholesalePrice ? `<button data-act="mode" data-idx="${idx}" class="badge ${i.mode==='wholesale'?'badge-accent':'badge-ok'}" style="border:none;">${i.mode==='wholesale'?'ОПТ':'РОЗН'}</button>` : ''}
        <div class="qty-stepper">
          <button data-act="dec" data-idx="${idx}">−</button>
          <span>${i.qty}</span>
          <button data-act="inc" data-idx="${idx}">+</button>
        </div>
        <div class="line-total">${fmt(i.price*i.qty)}</div>
        <button data-act="rm" data-idx="${idx}" style="background:none;border:none;color:var(--danger);font-size:18px;">✕</button>
      </div>
    `).join('') : `<div class="empty"><div class="big">🧾</div><p>Отсканируйте или найдите товар — он появится здесь</p></div>`}
  </div>
  `;
}

function cartLineFromProduct(p){
  return { barcode:p.barcode, name:p.name, retailPrice:p.price, wholesalePrice:p.wholesalePrice||0, mode:'retail', price:p.price, qty:1 };
}

async function addToCart(barcode){
  const p = await idbGet('products', barcode);
  if(!p){ toast('Товар не найден в базе. Добавьте его в «Каталоге».'); return; }
  if(p.qty <= 0){ toast(`«${p.name}» — товара нет на складе`); }
  const existing = cart.find(i=>i.barcode===barcode);
  if(existing) existing.qty += 1;
  else cart.push(cartLineFromProduct(p));
  render();
}

function bindKassaHandlers(){
  const sc = document.getElementById('scanner-wrap');
  if(sc) startScanner('kassa', addToCart);

  const manualBtn = document.getElementById('manualAddBtn');
  if(manualBtn) manualBtn.addEventListener('click', ()=>{
    const v = document.getElementById('manualBarcode').value.trim();
    if(v) addToCart(v);
  });

  const searchInput = document.getElementById('kassaSearch');
  if(searchInput) searchInput.addEventListener('input', async ()=>{
    const q = searchInput.value.trim().toLowerCase();
    const box = document.getElementById('kassaSearchResults');
    if(!q){ box.innerHTML=''; return; }
    const products = await idbGetAll('products');
    const found = products.filter(p=>p.name.toLowerCase().includes(q)).slice(0,6);
    box.innerHTML = found.length ? found.map(p=>`
      <div class="item-row" data-barcode="${p.barcode}" style="cursor:pointer;">
        <div class="info"><div class="name">${p.name}</div><div class="meta">${fmt(p.price)} сом · остаток ${p.qty}</div></div>
        <button class="badge badge-accent" style="border:none;">Добавить</button>
      </div>
    `).join('') : `<div class="empty" style="padding:10px;"><p>Ничего не найдено</p></div>`;
    box.querySelectorAll('[data-barcode]').forEach(row=>{
      row.addEventListener('click', ()=>{
        addToCart(row.dataset.barcode);
        searchInput.value=''; box.innerHTML='';
      });
    });
  });

  const modePayBtn = document.getElementById('modePayBtn');
  const modeDebtBtn = document.getElementById('modeDebtBtn');
  if(modePayBtn) modePayBtn.onclick = ()=>{ saleMode='pay'; render(); };
  if(modeDebtBtn) modeDebtBtn.onclick = ()=>{ saleMode='debt'; render(); };
  const debtorInput = document.getElementById('debtorNameInput');
  if(debtorInput) debtorInput.addEventListener('input', ()=>{ saleDebtorName = debtorInput.value; });

  document.querySelectorAll('[data-act]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const idx = +b.dataset.idx, act = b.dataset.act;
      if(act==='inc') cart[idx].qty++;
      if(act==='dec'){ cart[idx].qty--; if(cart[idx].qty<=0) cart.splice(idx,1); }
      if(act==='rm') cart.splice(idx,1);
      if(act==='mode'){
        const i = cart[idx];
        i.mode = i.mode==='retail' ? 'wholesale' : 'retail';
        i.price = i.mode==='retail' ? i.retailPrice : i.wholesalePrice;
      }
      render();
    });
  });

  const checkoutBtn = document.getElementById('checkoutBtn');
  if(checkoutBtn) checkoutBtn.addEventListener('click', checkout);
}

async function checkout(){
  if(!cart.length) return;
  if(saleMode==='debt'){
    const nameInput = document.getElementById('debtorNameInput');
    const name = (nameInput ? nameInput.value : saleDebtorName).trim();
    if(!name){ toast('Введите имя должника'); return; }
    saleDebtorName = name;
  }
  // проверка остатков
  for(const i of cart){
    const p = await idbGet('products', i.barcode);
    if(p) i.name = p.name;
  }
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const sale = {
    id: uid(), date: new Date().toISOString(), items: cart.map(i=>({...i})), total,
    paymentType: saleMode, debtorName: saleMode==='debt' ? saleDebtorName : null
  };

  // списание остатков
  for(const i of cart){
    const p = await idbGet('products', i.barcode);
    if(p){ p.qty = Math.max(0, (p.qty||0) - i.qty); await idbPut('products', p); }
  }
  await idbPut('sales', sale);

  if(saleMode==='debt'){
    const debtor = await findOrCreateDebtor(saleDebtorName);
    debtor.balance = (debtor.balance||0) + total;
    debtor.history = debtor.history || [];
    debtor.history.push({id:uid(), date:new Date().toISOString(), type:'charge', amount: total, note:`Чек №${sale.id.slice(-6).toUpperCase()}`});
    await idbPut('debtors', debtor);
    toast(`Записано в долг: ${debtor.name}`);
  }

  showReceiptModal(sale);
  cart = [];
  saleMode = 'pay'; saleDebtorName = '';
  render();
}

      <button class="btn btn-primary" id="amtSave">Сохранить</button>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('closeAmount').onclick = ()=>document.getElementById('amountModal').remove();
  document.getElementById('amtSave').onclick = async ()=>{
    const amount = +document.getElementById('amtValue').value || 0;
    if(amount<=0){ toast('Введите сумму больше нуля'); return; }
    const note = document.getElementById('amtNote').value.trim();
    d.balance = (d.balance||0) + (type==='payment'? -amount : amount);
    d.history = d.history || [];
    d.history.push({id:uid(), date:new Date().toISOString(), type, amount, note});
    await idbPut('debtors', d);
    document.getElementById('amountModal').remove();
    const dm = document.getElementById('debtorModal'); if(dm) dm.remove();
    toast(type==='payment' ? 'Оплата принята' : 'Долг добавлен');
    render();
  };
}
/* Найти или создать должника по имени — используется при продаже "в долг" из Кассы */
async function findOrCreateDebtor(name){
  const debtors = await idbGetAll('debtors');
  let d = debtors.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!d){
    d = {id: uid(), name, phone:'', balance:0, history:[]};
  }
  return d;
}


let reportPeriod = 'day';
function periodRange(period, ref=new Date()){
  const start = new Date(ref); const end = new Date(ref);
  if(period==='day'){ start.setHours(0,0,0,0); end.setHours(23,59,59,999); }
  if(period==='month'){ start.setDate(1); start.setHours(0,0,0,0); end.setMonth(end.getMonth()+1,0); end.setHours(23,59,59,999); }
  if(period==='quarter'){
    const q = Math.floor(start.getMonth()/3);
    start.setMonth(q*3,1); start.setHours(0,0,0,0);
    end.setMonth(q*3+3,0); end.setHours(23,59,59,999);
  }
  return {start, end};
}
/* ============ ОТЧЁТЫ ============ */
async function viewReports(){
  const sales = await idbGetAll('sales');
  const {start,end} = periodRange(reportPeriod);
  const filtered = sales.filter(s=>{ const d = new Date(s.date); return d>=start && d<=end; });
  const revenue = filtered.reduce((s,x)=>s+x.total,0);
  const receiptsCount = filtered.length;
  const itemsSold = filtered.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.qty,0),0);
  const avgCheck = receiptsCount? revenue/receiptsCount : 0;

  // топ товаров
  const map = {};
  filtered.forEach(s=>s.items.forEach(i=>{
    map[i.barcode] = map[i.barcode] || {name:i.name, qty:0, sum:0};
    map[i.barcode].qty += i.qty; map[i.barcode].sum += i.qty*i.price;
  }));
  const top = Object.values(map).sort((a,b)=>b.sum-a.sum).slice(0,8);

  const periodLabel = {day:'Сегодня', month:'Этот месяц', quarter:'Этот квартал'}[reportPeriod];

  return `
  <div class="period-tabs">
    <button data-period="day" class="${reportPeriod==='day'?'active':''}">День</button>
    <button data-period="month" class="${reportPeriod==='month'?'active':''}">Месяц</button>
    <button data-period="quarter" class="${reportPeriod==='quarter'?'active':''}">Квартал</button>
  </div>

  <div class="card" style="text-align:center;">
    <div class="section-title" style="margin-bottom:2px;">${periodLabel} · ${start.toLocaleDateString('ru-RU')} – ${end.toLocaleDateString('ru-RU')}</div>
    <div style="font-family:var(--mono); font-size:30px; font-weight:700; color:var(--primary); margin:6px 0;">${fmt(revenue)} сом</div>
    <div style="font-size:12px; color:var(--ink-soft);">выручка за период</div>
  </div>

  <div class="stat-grid">
    <div class="stat"><div class="n">${receiptsCount}</div><div class="l">Чеков</div></div>
    <div class="stat"><div class="n">${itemsSold}</div><div class="l">Продано, шт.</div></div>
    <div class="stat"><div class="n">${fmt(avgCheck)}</div><div class="l">Средний чек, сом</div></div>
    <div class="stat"><div class="n">${top.length}</div><div class="l">Наименований продано</div></div>
  </div>

  <div class="card">
    <div class="section-title">Топ товаров за период</div>
    ${top.length? top.map((t,idx)=>`
      <div class="item-row">
        <div class="info"><div class="name">${idx+1}. ${t.name}</div><div class="meta">${t.qty} шт.</div></div>
        <div class="line-total">${fmt(t.sum)}</div>
      </div>`).join('') : `<div class="empty"><p>Продаж за этот период ещё нет</p></div>`}
  </div>

  <button class="btn btn-outline" id="exportCsvBtn">Экспорт отчёта в CSV (для налоговой/бухгалтера)</button>
  `;
}
function bindReportsHandlers(){
  document.querySelectorAll('.period-tabs button').forEach(b=>{
    b.addEventListener('click', ()=>{ reportPeriod = b.dataset.period; render(); });
  });
  const exportBtn = document.getElementById('exportCsvBtn');
  if(exportBtn) exportBtn.addEventListener('click', exportReportCsv);
}
async function exportReportCsv(){
  const sales = await idbGetAll('sales');
  const {start,end} = periodRange(reportPeriod);
  const filtered = sales.filter(s=>{ const d = new Date(s.date); return d>=start && d<=end; });
  let csv = 'Дата;Время;Чек №;Товар;Штрихкод;Кол-во;Цена;Сумма\n';
  filtered.forEach(s=>{
    const d = new Date(s.date);
    s.items.forEach(i=>{
      csv += [
        d.toLocaleDateString('ru-RU'), d.toLocaleTimeString('ru-RU'),
        s.id.slice(-6).toUpperCase(), i.name, i.barcode, i.qty,
        i.price.toFixed(2), (i.qty*i.price).toFixed(2)
      ].join(';') + '\n';
    });
  });
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `otchet_${reportPeriod}_${todayKey()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Отчёт сохранён в загрузки');
}

function bindSettingsHandlers(){
  const saveShop = document.getElementById('saveShopName');
  if(saveShop) saveShop.onclick = async ()=>{
    const v = document.getElementById('shopNameInput').value.trim() || 'Мой магазин';
    await idbPut('meta', {key:'shopName', value:v});
    document.getElementById('shopName').textContent = v;
    toast('Название сохранено');
  };
  const saveFb = document.getElementById('saveFbConfig');
  if(saveFb) saveFb.onclick = async ()=>{
    const raw = document.getElementById('fbConfigInput').value.trim();
    if(!raw){ toast('Вставьте настройки Firebase'); return; }
    let cfg;
    try{ cfg = (new Function('return (' + raw + ')'))(); }
    catch(err){ toast('Не удалось прочитать настройки — проверьте, что скопирован весь объект'); return; }
    if(!cfg || !cfg.projectId){ toast('В настройках не хватает projectId — скопируйте объект полностью'); return; }
    await idbPutLocal('meta', {key:'firebaseConfig', value: cfg});
    toast('Сохранено, подключаю...');
    location.reload();
  };
  const disconnectCloud = document.getElementById('disconnectCloud');
  if(disconnectCloud) disconnectCloud.onclick = async ()=>{
    if(!confirm('Отключить общую базу на этом устройстве? Приложение вернётся к локальным данным этого телефона.')) return;
    await idbDeleteLocal('meta', 'firebaseConfig');
    location.reload();
  };
  const saveKkm = document.getElementById('saveKkm');
  if(saveKkm) saveKkm.onclick = async ()=>{
    const type = document.getElementById('kkmType').value;
    const address = document.getElementById('kkmAddress').value.trim();
    await idbPut('meta', {key:'kkm', type, address, configured: !!type});
    toast('Настройки ККМ сохранены');
  };
  const saveYk = document.getElementById('saveYakassa');
  if(saveYk) saveYk.onclick = async ()=>{
    const apiUrl = document.getElementById('ykApiUrl').value.trim();
    const apiKey = document.getElementById('ykApiKey').value.trim();
    const cashId = document.getElementById('ykCashId').value.trim();
    await idbPut('meta', {key:'yakassa', apiUrl, apiKey, cashId, configured: !!(apiUrl && apiKey)});
    toast('Доступ к YaKassa сохранён');
    render();
  };
  const exportAll = document.getElementById('exportAllBtn');
  if(exportAll) exportAll.onclick = async ()=>{
    reportPeriod = 'quarter'; // широкий диапазон для полного экспорта не ограничен периодом
    const sales = await idbGetAll('sales');
    let csv = 'Дата;Время;Чек №;Товар;Штрихкод;Кол-во;Цена;Сумма\n';
    sales.forEach(s=>{
      const d = new Date(s.date);
      s.items.forEach(i=>{
        csv += [d.toLocaleDateString('ru-RU'), d.toLocaleTimeString('ru-RU'), s.id.slice(-6).toUpperCase(), i.name, i.barcode, i.qty, i.price.toFixed(2), (i.qty*i.price).toFixed(2)].join(';')+'\n';
      });
    });
    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=`vse_prodazhi_${todayKey()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
  };
  const wipe = document.getElementById('wipeBtn');
  if(wipe) wipe.onclick = async ()=>{
    const msg = cloudMode
      ? 'Это удалит только настройки подключения на ЭТОМ устройстве (товары и продажи в общей базе останутся). Продолжить?'
      : 'Удалить ВСЕ товары, продажи и настройки на этом устройстве? Это необратимо.';
    if(!confirm(msg)) return;
    indexedDB.deleteDatabase(DB_NAME);
    location.reload();
  };
}
