<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Магазин — Касса и учёт</title>
<style>
:root{
  --bg:#F6F4EF;
  --surface:#FFFFFF;
  --ink:#191A17;
  --ink-soft:#5B5D56;
  --line:#E2DED3;
  --primary:#173D36;
  --primary-ink:#FFFFFF;
  --accent:#B8862E;
  --accent-soft:#F1E6CF;
  --danger:#A6362C;
  --danger-soft:#F6E4E1;
  --ok:#2F6B4F;
  --ok-soft:#E4EFE7;
  --radius:14px;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--sans); background:var(--bg); color:var(--ink);
  -webkit-user-select:none; user-select:none;
}
#app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

/* Header */
header{
  background:var(--primary); color:var(--primary-ink);
  padding:14px 16px 12px; display:flex; align-items:center; justify-content:space-between;
  flex-shrink:0;
}
header .brand{display:flex; flex-direction:column;}
header .brand b{font-size:17px; letter-spacing:.2px;}
header .brand span{font-size:11px; opacity:.75; font-family:var(--mono);}
header .clock{font-family:var(--mono); font-size:13px; opacity:.85; text-align:right;}

/* Main scroll area */
main{flex:1; overflow-y:auto; padding:14px 14px 90px;}

/* Bottom tab bar */
nav{
  position:fixed; bottom:0; left:0; right:0; background:var(--surface);
  border-top:1px solid var(--line); display:flex; z-index:50;
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; background:none; border:none; padding:10px 2px 8px; font-family:var(--sans);
  font-size:11px; color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:4px;
}
nav button .ic{font-size:19px;}
nav button.active{color:var(--primary); font-weight:700;}
nav button.active .ic{color:var(--accent);}

/* Cards / sections */
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; margin-bottom:12px;
}
.section-title{font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); margin:4px 0 10px; font-weight:700;}
.row{display:flex; gap:10px;}
.row > *{flex:1;}

/* Buttons */
button{cursor:pointer; font-family:var(--sans);}
.btn{
  border:none; border-radius:10px; padding:13px 16px; font-size:15px; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
}
.btn-primary{background:var(--primary); color:#fff;}
.btn-accent{background:var(--accent); color:#fff;}
.btn-outline{background:transparent; color:var(--primary); border:1.5px solid var(--primary);}
.btn-danger{background:var(--danger-soft); color:var(--danger);}
.btn-ghost{background:var(--bg); color:var(--ink); border:1px solid var(--line);}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.45;}

input, select{
  width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--line);
  font-size:15px; background:var(--surface); color:var(--ink); font-family:var(--sans);
}
input:focus, select:focus{outline:none; border-color:var(--primary);}
label{font-size:12px; color:var(--ink-soft); font-weight:600; display:block; margin:0 0 5px 2px;}
.field{margin-bottom:10px;}

/* Cart / list rows */
.item-row{
  display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);
}
.item-row:last-child{border-bottom:none;}
.item-row .info{flex:1; min-width:0;}
.item-row .name{font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.item-row .meta{font-size:12px; color:var(--ink-soft); font-family:var(--mono);}
.qty-stepper{display:flex; align-items:center; gap:8px;}
.qty-stepper button{
  width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--bg);
  font-size:17px; font-weight:700; color:var(--primary); line-height:1;
}
.qty-stepper span{min-width:26px; text-align:center; font-family:var(--mono); font-weight:700;}
.line-total{font-family:var(--mono); font-weight:700; min-width:70px; text-align:right;}

/* Big total bar */
.total-bar{
  background:var(--primary); color:#fff; border-radius:var(--radius); padding:16px;
  display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
}
.total-bar .label{font-size:12px; opacity:.8; text-transform:uppercase; letter-spacing:.5px;}
.total-bar .amount{font-family:var(--mono); font-size:26px; font-weight:700;}

/* Scanner */
#scanner-wrap{position:relative; border-radius:var(--radius); overflow:hidden; background:#000; margin-bottom:12px;}
#reader{width:100%;}
.scan-hint{position:absolute; bottom:8px; left:0; right:0; text-align:center; color:#fff; font-size:12px; font-family:var(--mono); text-shadow:0 1px 3px rgba(0,0,0,.6);}

/* Badges */
.badge{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; font-family:var(--mono);}
.badge-ok{background:var(--ok-soft); color:var(--ok);}
.badge-low{background:var(--danger-soft); color:var(--danger);}
.badge-accent{background:var(--accent-soft); color:var(--accent);}

/* Empty state */
.empty{padding:30px 10px; text-align:center; color:var(--ink-soft);}
.empty .big{font-size:32px; margin-bottom:8px;}
.empty p{font-size:13px; margin:4px 0 0;}

/* Modal */
.modal-bg{position:fixed; inset:0; background:rgba(20,20,18,.55); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
.modal{background:var(--surface); border-radius:18px 18px 0 0; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; padding:18px 18px 24px;}
.modal h3{margin:0 0 14px; font-size:16px;}
.modal-close{position:absolute; top:14px; right:16px; font-size:20px; color:var(--ink-soft); background:none; border:none;}

/* Receipt */
.receipt{background:#fff; border:1px dashed var(--line); border-radius:10px; padding:16px; font-family:var(--mono); font-size:12.5px;}
.receipt .rline{display:flex; justify-content:space-between; padding:3px 0;}
.receipt hr{border:none; border-top:1px dashed var(--line); margin:8px 0;}
.receipt .center{text-align:center;}

/* Report grid */
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px;}
.stat .n{font-family:var(--mono); font-size:20px; font-weight:700; color:var(--primary);}
.stat .l{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; margin-top:2px;}

.period-tabs{display:flex; gap:8px; margin-bottom:12px;}
.period-tabs button{flex:1; padding:9px; border-radius:9px; border:1.5px solid var(--line); background:var(--surface); font-size:13px; font-weight:600; color:var(--ink-soft);}
.period-tabs button.active{background:var(--primary); color:#fff; border-color:var(--primary);}

.toast{
  position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
  padding:10px 18px; border-radius:30px; font-size:13px; z-index:200; box-shadow:0 4px 14px rgba(0,0,0,.25);
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b id="shopName">Мой магазин</b><span id="deviceStatus">офлайн-режим · данные на устройстве</span></div>
    <div class="clock" id="clock">--:--</div>
  </header>
  <main id="main"></main>
  <nav id="tabbar">
    <button data-tab="kassa" class="active"><span class="ic">🧾</span>Касса</button>
    <button data-tab="prihod"><span class="ic">📥</span>Приход</button>
    <button data-tab="catalog"><span class="ic">📦</span>Каталог</button>
    <button data-tab="reports"><span class="ic">📊</span>Отчёты</button>
    <button data-tab="settings"><span class="ic">⚙️</span>Настройки</button>
  </nav>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
/* ============ ХРАНИЛИЩЕ (IndexedDB) ============ */
const DB_NAME = 'shopPosDB', DB_VER = 1;
let db;
function openDB(){
  return new Promise((res, rej)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('products')) d.createObjectStore('products', {keyPath:'barcode'});
      if(!d.objectStoreNames.contains('sales')) d.createObjectStore('sales', {keyPath:'id'});
      if(!d.objectStoreNames.contains('receipts')) d.createObjectStore('receipts', {keyPath:'id'});
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', {keyPath:'key'});
    };
    req.onsuccess = e=>{db=e.target.result; res(db);};
    req.onerror = e=>rej(e);
  });
}
function tx(store, mode='readonly'){ return db.transaction(store, mode).objectStore(store); }
function idbGetAll(store){ return new Promise((res)=>{ const r = tx(store).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>res([]); }); }
function idbGet(store, key){ return new Promise((res)=>{ const r = tx(store).get(key); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); }); }
function idbPut(store, val){ return new Promise((res,rej)=>{ const r = tx(store,'readwrite').put(val); r.onsuccess=()=>res(val); r.onerror=(e)=>rej(e); }); }
function idbDelete(store, key){ return new Promise((res)=>{ const r = tx(store,'readwrite').delete(key); r.onsuccess=()=>res(true); }); }

/* ============ УТИЛИТЫ ============ */
const fmt = n => (Math.round(n*100)/100).toLocaleString('ru-RU', {minimumFractionDigits:2, maximumFractionDigits:2});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}
function todayKey(d=new Date()){ return d.toISOString().slice(0,10); }

/* ============ СОСТОЯНИЕ ============ */
let currentTab = 'kassa';
let cart = []; // {barcode,name,price,qty}
let scannerCtrl = null;
let scannerMode = null; // 'kassa' | 'prihod' | 'catalog'

/* ============ ЧАСЫ ============ */
setInterval(()=>{
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}, 1000);

/* ============ РЕНДЕР ТАБОВ ============ */
document.getElementById('tabbar').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]'); if(!btn) return;
  stopScanner();
  currentTab = btn.dataset.tab;
  [...document.querySelectorAll('#tabbar button')].forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

async function render(){
  const main = document.getElementById('main');
  if(currentTab==='kassa') main.innerHTML = await viewKassa();
  else if(currentTab==='prihod') main.innerHTML = await viewPrihod();
  else if(currentTab==='catalog') main.innerHTML = await viewCatalog();
  else if(currentTab==='reports') main.innerHTML = await viewReports();
  else if(currentTab==='settings') main.innerHTML = await viewSettings();
  bindDynamicHandlers();
}

/* ============ СКАНЕР ШТРИХКОДА ============ */
function scannerHTML(hint){
  return `<div id="scanner-wrap">
    <div id="reader"></div>
    <div class="scan-hint">${hint}</div>
  </div>`;
}
async function startScanner(mode, onResult){
  scannerMode = mode;
  const wrap = document.getElementById('scanner-wrap');
  if(!wrap) return;
  try{
    scannerCtrl = new Html5Qrcode("reader");
    const config = { fps:10, qrbox:{width:250,height:130}, formatsToSupport:[
      Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.QR_CODE
    ]};
    await scannerCtrl.start({facingMode:"environment"}, config, (decodedText)=>{
      if(navigator.vibrate) navigator.vibrate(60);
      onResult(decodedText);
    }, ()=>{});
  }catch(err){
    wrap.innerHTML = `<div class="empty"><div class="big">🚫</div><p>Нет доступа к камере.<br>Разрешите камеру в браузере или введите код вручную ниже.</p></div>`;
  }
}
function stopScanner(){
  if(scannerCtrl){
    scannerCtrl.stop().then(()=>scannerCtrl.clear()).catch(()=>{});
    scannerCtrl = null;
  }
}

/* ============ КАССА (продажа) ============ */
async function viewKassa(){
  const total = cart.reduce((s,i)=>s+i.price*i.qty, 0);
  const count = cart.reduce((s,i)=>s+i.qty, 0);
  return `
  ${scannerHTML('Наведите камеру на штрихкод товара')}
  <div class="card" style="padding:10px 12px;">
    <div class="row">
      <input id="manualBarcode" placeholder="Или введите штрихкод вручную" inputmode="numeric">
      <button class="btn btn-ghost" style="width:auto; padding:11px 14px;" id="manualAddBtn">＋</button>
    </div>
  </div>

  <div class="total-bar">
    <div><div class="label">Итого чек · ${count} шт.</div><div class="amount">${fmt(total)} сом</div></div>
    <button class="btn btn-accent" style="width:auto; padding:12px 20px;" id="checkoutBtn" ${cart.length? '':'disabled'}>Оформить</button>
  </div>

  <div class="card">
    <div class="section-title">Товары в чеке</div>
    ${cart.length ? cart.map((i,idx)=>`
      <div class="item-row">
        <div class="info">
          <div class="name">${i.name}</div>
          <div class="meta">${fmt(i.price)} сом/шт · ${i.barcode}</div>
        </div>
        <div class="qty-stepper">
          <button data-act="dec" data-idx="${idx}">−</button>
          <span>${i.qty}</span>
          <button data-act="inc" data-idx="${idx}">+</button>
        </div>
        <div class="line-total">${fmt(i.price*i.qty)}</div>
        <button data-act="rm" data-idx="${idx}" style="background:none;border:none;color:var(--danger);font-size:18px;">✕</button>
      </div>
    `).join('') : `<div class="empty"><div class="big">🧾</div><p>Отсканируйте товар — он появится здесь</p></div>`}
  </div>
  `;
}

async function addToCart(barcode){
  const p = await idbGet('products', barcode);
  if(!p){ toast('Товар не найден в базе. Добавьте его в «Каталоге».'); return; }
  if(p.qty <= 0){ toast(`«${p.name}» — товара нет на складе`); }
  const existing = cart.find(i=>i.barcode===barcode);
  if(existing) existing.qty += 1;
  else cart.push({barcode:p.barcode, name:p.name, price:p.price, qty:1});
  render();
}

function bindKassaHandlers(){
  const sc = document.getElementById('scanner-wrap');
  if(sc) startScanner('kassa', addToCart);

  const manualBtn = document.getElementById('manualAddBtn');
  if(manualBtn) manualBtn.addEventListener('click', ()=>{
    const v = document.getElementById('manualBarcode').value.trim();
    if(v) addToCart(v);
  });

  document.querySelectorAll('[data-act]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const idx = +b.dataset.idx, act = b.dataset.act;
      if(act==='inc') cart[idx].qty++;
      if(act==='dec'){ cart[idx].qty--; if(cart[idx].qty<=0) cart.splice(idx,1); }
      if(act==='rm') cart.splice(idx,1);
      render();
    });
  });

  const checkoutBtn = document.getElementById('checkoutBtn');
  if(checkoutBtn) checkoutBtn.addEventListener('click', checkout);
}

async function checkout(){
  if(!cart.length) return;
  // проверка остатков
  for(const i of cart){
    const p = await idbGet('products', i.barcode);
    if(p) i.name = p.name;
  }
  const total = cart.reduce((s,i)=>s+i.price*i.qty,0);
  const sale = { id: uid(), date: new Date().toISOString(), items: cart.map(i=>({...i})), total };

  // списание остатков
  for(const i of cart){
    const p = await idbGet('products', i.barcode);
    if(p){ p.qty = Math.max(0, (p.qty||0) - i.qty); await idbPut('products', p); }
  }
  await idbPut('sales', sale);
  showReceiptModal(sale);
  cart = [];
  render();
}

function showReceiptModal(sale){
  const shopName = document.getElementById('shopName').textContent;
  const html = `
  <div class="modal-bg" id="receiptModal">
    <div class="modal" style="position:relative;">
      <button class="modal-close" id="closeReceipt">✕</button>
      <h3>Чек №${sale.id.slice(-6).toUpperCase()}</h3>
      <div class="receipt">
        <div class="center"><b>${shopName}</b></div>
        <div class="center">${new Date(sale.date).toLocaleString('ru-RU')}</div>
        <hr>
        ${sale.items.map(i=>`
          <div class="rline"><span>${i.name}</span></div>
          <div class="rline"><span>${i.qty} × ${fmt(i.price)}</span><span>${fmt(i.qty*i.price)}</span></div>
        `).join('')}
        <hr>
        <div class="rline" style="font-weight:700; font-size:14px;"><span>ИТОГО</span><span>${fmt(sale.total)} сом</span></div>
      </div>
      <div style="height:12px;"></div>
      <button class="btn btn-primary" id="sendKkmBtn">Отправить чек на ККМ</button>
      <div style="height:8px;"></div>
      <button class="btn btn-ghost" id="closeReceipt2">Закрыть</button>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('closeReceipt').onclick = ()=>document.getElementById('receiptModal').remove();
  document.getElementById('closeReceipt2').onclick = ()=>document.getElementById('receiptModal').remove();
  document.getElementById('sendKkmBtn').onclick = ()=>sendToKKM(sale);
}

async function sendToKKM(sale){
  const yk = await idbGet('meta','yakassa');
  if(yk && yk.configured){
    // ЗАГЛУШКА: реальный вызов появится, когда будет получен формат запроса от поставщика YaKassa/Ярос Групп.
    // Ниже — заготовка структуры запроса на основе типового REST API фискальных касс;
    // потребует уточнения точных названий полей и эндпоинта по документации поставщика.
    try{
      toast('Отправка чека в YaKassa...');
      /*
      const resp = await fetch(yk.apiUrl, {
        method:'POST',
        headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+yk.apiKey},
        body: JSON.stringify({
          cashId: yk.cashId,
          type: 'sale',
          items: sale.items.map(i=>({name:i.name, price:i.price, quantity:i.qty, barcode:i.barcode})),
          total: sale.total
        })
      });
      const data = await resp.json();
      */
      toast('Настройки API сохранены. Реальный запрос будет включён, как только поступит документация YaKassa.');
    }catch(err){
      toast('Ошибка отправки в YaKassa: '+err.message);
    }
    return;
  }
  const cfg = await idbGet('meta','kkm');
  if(!cfg || !cfg.configured){
    toast('ККМ не настроен. Откройте «Настройки» → «ККМ: Aisino A90 Pro / YaKassa»');
    return;
  }
  // ЗАГЛУШКА интеграции: здесь будет реальный вызов протокола/SDK конкретной модели ККМ
  toast('Чек отправлен на ККМ (демо-режим — нужна настройка реального устройства)');
}

/* ============ ПРИХОД ТОВАРА ============ */
let prihodPending = null; // {barcode, existing}

async function viewPrihod(){
  return `
  ${scannerHTML('Отсканируйте товар для прихода')}
  <div class="card" style="padding:10px 12px;">
    <div class="row">
      <input id="manualBarcodeP" placeholder="Или введите штрихкод вручную" inputmode="numeric">
      <button class="btn btn-ghost" style="width:auto; padding:11px 14px;" id="manualAddBtnP">＋</button>
    </div>
  </div>
  <div class="card">
    <div class="section-title">Как это работает</div>
    <p style="font-size:13px; color:var(--ink-soft); line-height:1.5; margin:0;">
      Отсканируйте штрихкод. Если товар уже есть в базе — укажите, сколько единиц пришло, остаток увеличится.
      Если товара нет — заполните карточку нового товара.
    </p>
  </div>
  `;
}

function bindPrihodHandlers(){
  const sc = document.getElementById('scanner-wrap');
  if(sc) startScanner('prihod', handlePrihodScan);
  const manualBtn = document.getElementById('manualAddBtnP');
  if(manualBtn) manualBtn.addEventListener('click', ()=>{
    const v = document.getElementById('manualBarcodeP').value.trim();
    if(v) handlePrihodScan(v);
  });
}

async function handlePrihodScan(barcode){
  stopScanner();
  const p = await idbGet('products', barcode);
  openPrihodModal(barcode, p);
}

function openPrihodModal(barcode, existing){
  const html = existing ? `
    <div class="modal-bg" id="prihodModal">
      <div class="modal" style="position:relative;">
        <button class="modal-close" id="closePrihod">✕</button>
        <h3>Приход товара</h3>
        <div class="card" style="margin-bottom:12px;">
          <div class="name" style="font-size:15px; font-weight:700;">${existing.name}</div>

      toast(`Оприходовано: +${q} шт. «${existing.name}»`);
      render();
    };

      toast(`Товар «${name}» добавлен и оприходован`);
      render();
    };
  }
}

  return products.map(p=>`

        <span class="badge ${p.qty<=3?'badge-low':'badge-ok'}">${p.qty} шт.</span>

/* ============ ОТЧЁТЫ ============ */
let reportPeriod = 'day';
function periodRange(period, ref=new Date()){
  const start = new Date(ref); const end = new Date(ref);
  if(period==='day'){ start.setHours(0,0,0,0); end.setHours(23,59,59,999); }
  if(period==='month'){ start.setDate(1); start.setHours(0,0,0,0); end.setMonth(end.getMonth()+1,0); end.setHours(23,59,59,999); }
  if(period==='quarter'){
    const q = Math.floor(start.getMonth()/3);
    start.setMonth(q*3,1); start.setHours(0,0,0,0);
    end.setMonth(q*3+3,0); end.setHours(23,59,59,999);
  }
  return {start, end};
}
async function viewReports(){
  const sales = await idbGetAll('sales');
  const {start,end} = periodRange(reportPeriod);
  const filtered = sales.filter(s=>{ const d = new Date(s.date); return d>=start && d<=end; });
  const revenue = filtered.reduce((s,x)=>s+x.total,0);
  const receiptsCount = filtered.length;
  const itemsSold = filtered.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.qty,0),0);
  const avgCheck = receiptsCount? revenue/receiptsCount : 0;

  // топ товаров
  const map = {};
  filtered.forEach(s=>s.items.forEach(i=>{
    map[i.barcode] = map[i.barcode] || {name:i.name, qty:0, sum:0};
    map[i.barcode].qty += i.qty; map[i.barcode].sum += i.qty*i.price;
  }));
  const top = Object.values(map).sort((a,b)=>b.sum-a.sum).slice(0,8);

  const periodLabel = {day:'Сегодня', month:'Этот месяц', quarter:'Этот квартал'}[reportPeriod];

  return `
  <div class="period-tabs">
    <button data-period="day" class="${reportPeriod==='day'?'active':''}">День</button>
    <button data-period="month" class="${reportPeriod==='month'?'active':''}">Месяц</button>
    <button data-period="quarter" class="${reportPeriod==='quarter'?'active':''}">Квартал</button>
  </div>

  <div class="card" style="text-align:center;">
    <div class="section-title" style="margin-bottom:2px;">${periodLabel} · ${start.toLocaleDateString('ru-RU')} – ${end.toLocaleDateString('ru-RU')}</div>
    <div style="font-family:var(--mono); font-size:30px; font-weight:700; color:var(--primary); margin:6px 0;">${fmt(revenue)} сом</div>
    <div style="font-size:12px; color:var(--ink-soft);">выручка за период</div>
  </div>

  <div class="stat-grid">
    <div class="stat"><div class="n">${receiptsCount}</div><div class="l">Чеков</div></div>
    <div class="stat"><div class="n">${itemsSold}</div><div class="l">Продано, шт.</div></div>
    <div class="stat"><div class="n">${fmt(avgCheck)}</div><div class="l">Средний чек, сом</div></div>
    <div class="stat"><div class="n">${top.length}</div><div class="l">Наименований продано</div></div>
  </div>

  <div class="card">
    <div class="section-title">Топ товаров за период</div>
    ${top.length? top.map((t,idx)=>`
      <div class="item-row">
        <div class="info"><div class="name">${idx+1}. ${t.name}</div><div class="meta">${t.qty} шт.</div></div>
        <div class="line-total">${fmt(t.sum)}</div>
      </div>`).join('') : `<div class="empty"><p>Продаж за этот период ещё нет</p></div>`}
  </div>

  <button class="btn btn-outline" id="exportCsvBtn">Экспорт отчёта в CSV (для налоговой/бухгалтера)</button>
  `;
}
function bindReportsHandlers(){
  document.querySelectorAll('.period-tabs button').forEach(b=>{
    b.addEventListener('click', ()=>{ reportPeriod = b.dataset.period; render(); });
  });
  const exportBtn = document.getElementById('exportCsvBtn');
  if(exportBtn) exportBtn.addEventListener('click', exportReportCsv);
}
async function exportReportCsv(){
  const sales = await idbGetAll('sales');
  const {start,end} = periodRange(reportPeriod);
  const filtered = sales.filter(s=>{ const d = new Date(s.date); return d>=start && d<=end; });
  let csv = 'Дата;Время;Чек №;Товар;Штрихкод;Кол-во;Цена;Сумма\n';
  filtered.forEach(s=>{
    const d = new Date(s.date);
    s.items.forEach(i=>{
      csv += [
        d.toLocaleDateString('ru-RU'), d.toLocaleTimeString('ru-RU'),
        s.id.slice(-6).toUpperCase(), i.name, i.barcode, i.qty,
        i.price.toFixed(2), (i.qty*i.price).toFixed(2)
      ].join(';') + '\n';
    });
  });
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `otchet_${reportPeriod}_${todayKey()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  toast('Отчёт сохранён в загрузки');
}
